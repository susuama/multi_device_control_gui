<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pywebview 中核検証</title>
    <style>
      body { margin: 0; font: 14px sans-serif; }
      main { padding: 20px; min-height: 100vh; box-sizing: border-box; }
      main[data-theme="dark"] { background: #18202b; color: #eee; }
      header, nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
      .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      section { border: 1px solid #888; padding: 16px; min-width: 0; }
      textarea { box-sizing: border-box; width: 100%; height: 140px; }
      button, input, select { padding: 6px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      [role="alert"] { color: #e76d6d; }
    </style>
  </head>

    <div id="root"></div>
